  <rect x="68" y="25" width="8" height="78" fill="#ffffff" rx="2"/>
  <rect x="84" y="35" width="8" height="58" fill="#ffffff" rx="2"/>
  <rect x="100" y="50" width="8" height="28" fill="#ffffff" rx="2"/>
  
  <!-- Music note accent -->
